---
- name: Deployer la version vulnerable du labo J3
  hosts: app-dev
  become: true

  vars:
    app_dir: /home/admin/to-do-list-unsecure
    source_repo: https://github.com/gaeldb/to-do-list-unsecure.git

  pre_tasks:
    - name: Verifier la cible et la branche
      ansible.builtin.assert:
        that:
          - target == 'app-dev'
          - branch == 'main'
          - target != 'app-prod1' or branch == 'main'
        fail_msg: "Le labo J3 autorise uniquement app-dev et la branche main."

    - name: Verifier le venv existant
      ansible.builtin.stat:
        path: "{{ app_dir }}/.venv/bin/python"
      register: app_python

    - name: Verifier le deploiement initial
      ansible.builtin.assert:
        that:
          - app_python.stat.exists

  tasks:
    - name: Installer Git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Creer la configuration secrete si absente
      ansible.builtin.shell: |
        umask 077
        /usr/bin/python3 - <<'PY'
        import secrets
        from pathlib import Path
        Path("/etc/todolist.env").write_text(
            "DJANGO_SECRET_KEY=" + secrets.token_urlsafe(64) + "\n"
        )
        PY
      args:
        creates: /etc/todolist.env
      no_log: true

    - name: Proteger la configuration secrete
      ansible.builtin.file:
        path: /etc/todolist.env
        owner: root
        group: root
        mode: "0600"

    - name: Lire la configuration pour les migrations
      ansible.builtin.slurp:
        src: /etc/todolist.env
      register: django_env
      no_log: true

    - name: Creer le dossier de configuration du service
      ansible.builtin.file:
        path: /etc/systemd/system/todolist.service.d
        state: directory
        mode: "0755"

    - name: Injecter les variables dans le service
      ansible.builtin.copy:
        dest: /etc/systemd/system/todolist.service.d/environment.conf
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile=/etc/todolist.env
          Environment="DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,{{ ansible_host }}"

    - name: Creer un dossier temporaire
      become_user: admin
      ansible.builtin.tempfile:
        state: directory
        prefix: todolist-deploy-
      register: release

    - name: Mettre a jour l'application
      block:
        - name: Recuperer la version originale du professeur
          become_user: admin
          ansible.builtin.git:
            repo: "{{ source_repo }}"
            dest: "{{ release.path }}/source"
            version: "{{ branch }}"
          register: checkout

        - name: Afficher le commit deploye
          ansible.builtin.debug:
            msg: "Cible={{ target }} Branche={{ branch }} Commit={{ checkout.after }}"

        - name: Creer une archive du code
          become_user: admin
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ release.path }}/source"
              - archive
              - --format=tar
              - "--output={{ release.path }}/code.tar"
              - HEAD

        - name: Arreter Todolist avant le remplacement
          ansible.builtin.systemd:
            name: todolist
            state: stopped

        - name: Sauvegarder la base actuelle
          ansible.builtin.copy:
            src: "{{ app_dir }}/db.sqlite3"
            dest: "{{ app_dir }}/db.sqlite3.avant-j3-{{ ansible_date_time.epoch }}"
            remote_src: true
            owner: root
            group: root
            mode: "0600"

        - name: Installer le code original et la base du professeur
          ansible.builtin.unarchive:
            src: "{{ release.path }}/code.tar"
            dest: "{{ app_dir }}"
            remote_src: true
            owner: admin
            group: admin
            exclude:
              - .venv
              - .env
              - requirements-deploiement.txt

        - name: Donner au service l'acces a la base du labo
          ansible.builtin.file:
            path: "{{ app_dir }}/db.sqlite3"
            owner: todolist
            group: todolist
            mode: "0600"

        - name: Copier les versions de dependances validees
          ansible.builtin.copy:
            src: requirements-deploiement.txt
            dest: "{{ app_dir }}/requirements-deploiement.txt"
            owner: admin
            group: admin
            mode: "0644"

        - name: Installer les dependances corrigees
          become_user: admin
          ansible.builtin.pip:
            requirements: "{{ app_dir }}/requirements-deploiement.txt"
            virtualenv: "{{ app_dir }}/.venv"

        - name: Appliquer les migrations Django
          become_user: todolist
          environment:
            DJANGO_SECRET_KEY: "{{ (django_env.content | b64decode).split('=', 1)[1] | trim }}"
            DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,{{ ansible_host }}"
          ansible.builtin.command:
            argv:
              - "{{ app_dir }}/.venv/bin/python"
              - manage.py
              - migrate
              - --noinput
            chdir: "{{ app_dir }}"
          no_log: true

        - name: Redemarrer Todolist
          ansible.builtin.systemd:
            name: todolist
            daemon_reload: true
            state: restarted
            enabled: true

        - name: Verifier la reponse HTTP locale
          ansible.builtin.uri:
            url: http://127.0.0.1/
            status_code: 200
          register: health
          until: health.status == 200
          retries: 10
          delay: 3

      always:
        - name: Supprimer les fichiers temporaires
          ansible.builtin.file:
            path: "{{ release.path }}"
            state: absent
        - name: Relancer Todolist meme si le deploiement echoue
          ansible.builtin.systemd:
            name: todolist
            state: started
